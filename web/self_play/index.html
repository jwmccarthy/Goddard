<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Goddard Checkpoint Match</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    :root {
      --ink: #1b292d;
      --muted: #526268;
      --surface: rgba(249, 251, 251, 0.93);
      --border: #aebdc0;
      --blue: #145bd7;
      --orange: #e65b35;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      overflow: hidden;
      background: #bfd1d6;
      color: var(--ink);
      font: 13px/1.4 system-ui, sans-serif;
    }
    #view { position: fixed; inset: 0; }

    .match-info {
      position: fixed;
      top: 12px;
      right: 12px;
      width: min(480px, calc(100vw - 24px));
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 3px;
      background: var(--surface);
      pointer-events: none;
    }
    .scoreboard {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      gap: 12px;
    }
    .team {
      overflow: hidden;
      font-size: 12px;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .team.blue { color: var(--blue); text-align: right; }
    .team.orange { color: var(--orange); }
    #goals {
      font-size: 22px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .objectives {
      margin-top: 6px;
      color: var(--muted);
      font-size: 11px;
      text-align: center;
    }
    .boost-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
    }
    .boost-meter { font-size: 11px; }
    .boost-meter header { display: flex; justify-content: space-between; margin-bottom: 3px; }
    .boost-meter output { font-variant-numeric: tabular-nums; }
    .boost-meter i { display: block; height: 4px; background: #d6dfe1; }
    .boost-meter b { display: block; width: 0; height: 100%; background: var(--blue); transition: width 80ms linear; }
    .boost-meter.orange b { background: var(--orange); }

    .controls {
      position: fixed;
      left: 12px;
      bottom: 12px;
      width: max-content;
      max-width: calc(100vw - 24px);
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 8px;
    }
    .selector {
      display: grid;
      flex: none;
      width: 230px;
      gap: 3px;
      color: var(--ink);
      font-size: 11px;
    }
    .selector .form-select { min-width: 0; }
    #connection {
      margin-left: auto;
      align-self: center;
      max-width: 100%;
      overflow-wrap: anywhere;
      color: var(--ink);
      font-size: 11px;
    }
    @media (max-width: 760px) {
      .match-info { top: 8px; right: 8px; width: calc(100vw - 16px); }
      .controls {
        left: 8px;
        bottom: 8px;
        width: calc(100vw - 16px);
        max-width: none;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px;
      }
      .selector { width: auto; min-width: 0; }
      .controls .btn { width: 100%; }
      #connection { margin-left: 0; justify-self: end; }
    }
  </style>
</head>
<body>
  <div id="view"></div>
  <section class="match-info" aria-label="Match status">
    <div class="scoreboard">
      <div id="blue" class="team blue">Blue</div>
      <div id="goals">0 - 0</div>
      <div id="orange" class="team orange">Orange</div>
    </div>
    <div id="objectives" class="objectives" hidden></div>
    <div class="boost-grid">
      <div class="boost-meter">
        <header><span>Blue boost</span><output id="blue-boost">0</output></header>
        <i><b id="blue-boost-fill"></b></i>
      </div>
      <div class="boost-meter orange">
        <header><span>Orange boost</span><output id="orange-boost">0</output></header>
        <i><b id="orange-boost-fill"></b></i>
      </div>
    </div>
  </section>
  <div class="controls">
    <label class="selector">Blue checkpoint<select class="form-select form-select-sm" id="blueCheckpoint"></select></label>
    <label class="selector">Orange checkpoint<select class="form-select form-select-sm" id="orangeCheckpoint"></select></label>
    <button class="btn btn-sm btn-primary" id="applyMatch">Apply match</button>
    <button class="btn btn-sm btn-outline-secondary" id="resetMatch" disabled>Random demo state</button>
    <button class="btn btn-sm btn-outline-secondary" id="kickoffMatch">Kickoff</button>
    <div id="connection">Connecting</div>
  </div>
  <script type="importmap">
    {"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
  </script>
  <script type="module" src="/app.js"></script>
</body>
</html>
