<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PULSE Checkpoint Match</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #10252d;
      --muted: #557078;
      --paper: rgba(241, 247, 245, 0.9);
      --line: rgba(24, 67, 75, 0.16);
      --blue: #145bd7;
      --orange: #e65b35;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      overflow: hidden;
      background: #bfd1d6;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #view { position: fixed; inset: 0; }

    .masthead {
      position: fixed;
      top: 20px;
      left: 20px;
      right: 20px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      pointer-events: none;
    }
    .brand, .telemetry {
      border: 1px solid rgba(255, 255, 255, 0.8);
      background: var(--paper);
    }
    .brand {
      padding: 13px 16px 14px;
      border-radius: 4px 18px 18px 18px;
    }
    .telemetry {
      width: min(560px, 58vw);
      padding: 14px 16px;
      border-radius: 18px 4px 18px 18px;
    }
    .eyebrow {
      color: var(--muted);
      font-size: 10px;
      font-weight: 750;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    h1 {
      margin: 3px 0 0;
      font-size: clamp(18px, 2vw, 26px);
      font-weight: 760;
      letter-spacing: -0.04em;
    }
    .scoreboard {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      gap: 14px;
      margin-top: 5px;
    }
    .team {
      overflow: hidden;
      font: 650 11px ui-monospace, SFMono-Regular, Menlo, monospace;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .team.blue { color: var(--blue); text-align: right; }
    .team.orange { color: var(--orange); }
    #goals {
      font: 800 25px ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: -0.07em;
    }
    .meta {
      margin-top: 3px;
      color: var(--muted);
      font: 600 10px ui-monospace, SFMono-Regular, Menlo, monospace;
      text-align: center;
    }
    .boost-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 11px;
    }
    .boost-meter { color: var(--muted); font-size: 10px; font-weight: 750; }
    .boost-meter header { display: flex; justify-content: space-between; margin-bottom: 5px; }
    .boost-meter output { color: var(--ink); font: 700 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .boost-meter i { display: block; height: 5px; background: rgba(16, 37, 45, 0.12); }
    .boost-meter b { display: block; width: 0; height: 100%; background: var(--blue); transition: width 80ms linear; }
    .boost-meter.orange b { background: var(--orange); }

    .controls {
      position: fixed;
      left: 20px;
      right: 20px;
      bottom: 20px;
      display: flex;
      align-items: end;
      gap: 10px;
    }
    .selector {
      display: grid;
      gap: 4px;
      width: min(300px, 29vw);
      color: var(--muted);
      font-size: 9px;
      font-weight: 750;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    select, button {
      min-height: 38px;
      border: 1px solid rgba(10, 55, 66, 0.14);
      border-radius: 12px;
      font: 650 11px ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    select {
      width: 100%;
      padding: 0 11px;
      background: var(--paper);
      color: var(--ink);
    }
    button {
      padding: 0 15px;
      background: #123f49;
      color: white;
      cursor: pointer;
    }
    button:hover { background: #0b5963; }
    #connection {
      margin-left: auto;
      padding: 8px 11px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 99px;
      background: var(--paper);
      color: var(--muted);
      font-size: 10px;
      font-weight: 750;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    #connection.live::before {
      display: inline-block;
      width: 7px;
      height: 7px;
      margin-right: 7px;
      border-radius: 50%;
      background: #16a47b;
      content: "";
    }

    @media (max-width: 760px) {
      .masthead { top: 10px; left: 10px; right: 10px; display: grid; }
      .brand { width: max-content; padding: 10px 13px; }
      .telemetry { width: calc(100vw - 20px); padding: 11px 13px; }
      .controls { left: 10px; right: 10px; bottom: 10px; display: grid; grid-template-columns: 1fr 1fr; }
      .selector { width: auto; }
      #connection { position: fixed; right: 10px; top: 10px; }
    }
  </style>
</head>
<body>
  <div id="view"></div>
  <header class="masthead">
    <div class="brand">
      <div class="eyebrow">Goddard Lab</div>
      <h1>Checkpoint Match</h1>
    </div>
    <section class="telemetry" aria-live="polite">
      <div class="eyebrow">Deterministic self-play</div>
      <div class="scoreboard">
        <div id="blue" class="team blue">BLUE</div>
        <div id="goals">0 - 0</div>
        <div id="orange" class="team orange">ORANGE</div>
      </div>
      <div id="round" class="meta">connecting</div>
      <div class="boost-grid">
        <div class="boost-meter">
          <header><span>Blue boost</span><output id="blue-boost">0</output></header>
          <i><b id="blue-boost-fill"></b></i>
        </div>
        <div class="boost-meter orange">
          <header><span>Orange boost</span><output id="orange-boost">0</output></header>
          <i><b id="orange-boost-fill"></b></i>
        </div>
      </div>
    </section>
  </header>
  <div class="controls">
    <label class="selector">Blue checkpoint<select id="blueCheckpoint"></select></label>
    <label class="selector">Orange checkpoint<select id="orangeCheckpoint"></select></label>
    <button id="applyMatch">Apply match</button>
    <button id="resetMatch">New demo state</button>
    <div id="connection">Connecting</div>
  </div>
  <script type="importmap">
    {"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
  </script>
  <script type="module" src="/app.js"></script>
</body>
</html>
