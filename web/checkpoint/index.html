<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Trajectory Monitor</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #10252d;
      --muted: #557078;
      --paper: rgba(241, 247, 245, 0.9);
      --line: rgba(24, 67, 75, 0.16);
      --agent: #145bd7;
      --expert: #009b82;
      --opponent: #e54f42;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      overflow: hidden;
      background: #bfd1d6;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #view { position: fixed; inset: 0; }

    .masthead {
      position: fixed;
      top: 20px;
      left: 20px;
      right: 20px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      pointer-events: none;
    }

    .brand,
    .telemetry {
      border: 1px solid rgba(255, 255, 255, 0.8);
      background: var(--paper);
    }

    .telemetry { pointer-events: auto; }

    .brand {
      padding: 13px 16px 14px;
      border-radius: 4px 18px 18px 18px;
    }

    .eyebrow {
      color: var(--muted);
      font-size: 10px;
      font-weight: 750;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 3px 0 0;
      font-size: clamp(18px, 2vw, 26px);
      font-weight: 760;
      letter-spacing: -0.04em;
    }

    .telemetry {
      min-width: min(390px, 48vw);
      padding: 14px 16px;
      border-radius: 18px 4px 18px 18px;
    }

    .telemetry-row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      align-items: baseline;
    }

    .checkpoint {
      color: var(--muted);
      font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace;
      overflow-wrap: anywhere;
      user-select: text;
    }

    .copy-demo {
      padding: 6px 9px;
      border-radius: 8px;
      font-size: 10px;
    }

    .boost-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 11px;
    }

    .boost-meter { color: var(--muted); font-size: 10px; font-weight: 750; }
    .boost-meter header { display: flex; justify-content: space-between; margin-bottom: 5px; }
    .boost-meter output { color: var(--ink); font: 700 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .boost-meter i { display: block; height: 5px; background: rgba(16, 37, 45, 0.12); }
    .boost-meter b { display: block; width: 0; height: 100%; background: var(--agent); transition: width 80ms linear; }
    .boost-meter.expert b { background: var(--expert); }

    .action-readout {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      margin-top: 11px;
    }

    .action-readout span {
      padding: 5px 2px;
      border: 1px solid var(--line);
      color: var(--muted);
      font: 700 10px ui-monospace, SFMono-Regular, Menlo, monospace;
      text-align: center;
    }

    .action-readout b { display: block; color: var(--ink); font-size: 11px; }

    .reward {
      font: 800 24px ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: -0.06em;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 18px;
      margin-top: 11px;
      padding-top: 10px;
      border-top: 1px solid var(--line);
      color: #36545c;
      font-size: 11px;
      font-weight: 650;
    }

    .legend span { display: inline-flex; align-items: center; gap: 7px; }
    .swatch { width: 18px; height: 5px; border-radius: 10px; }
    .swatch.agent { background: var(--agent); }
    .swatch.expert { background: var(--expert); }
    .swatch.opponent { background: var(--opponent); }

    .controls {
      position: fixed;
      left: 20px;
      bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    button {
      padding: 11px 16px;
      border: 1px solid rgba(10, 55, 66, 0.14);
      border-radius: 12px;
      background: #123f49;
      color: white;
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: background 120ms ease;
    }

    button:hover { background: #0b5963; }

    .speed-control {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 8px 11px;
      border: 1px solid rgba(10, 55, 66, 0.14);
      border-radius: 12px;
      background: var(--paper);
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }

    .speed-control input { width: 120px; }
    .speed-control output {
      min-width: 32px;
      color: var(--ink);
      font: 700 11px ui-monospace, SFMono-Regular, Menlo, monospace;
      text-align: right;
    }

    .demo-search { display: flex; gap: 6px; }
    .demo-search input {
      width: min(280px, 38vw);
      padding: 10px 12px;
      border: 1px solid rgba(10, 55, 66, 0.14);
      border-radius: 12px;
      background: var(--paper);
      color: var(--ink);
      font: 600 12px ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    #connection {
      padding: 8px 11px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 99px;
      background: var(--paper);
      color: var(--muted);
      font-size: 10px;
      font-weight: 750;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    #connection.live::before {
      display: inline-block;
      width: 7px;
      height: 7px;
      margin-right: 7px;
      border-radius: 50%;
      background: #16a47b;
      content: "";
    }

    @media (max-width: 680px) {
      .masthead { top: 10px; left: 10px; right: 10px; display: grid; }
      .brand { width: max-content; padding: 10px 13px; }
      .telemetry { min-width: 0; width: 100%; padding: 11px 13px; }
      .reward { font-size: 20px; }
      .controls { left: 10px; bottom: 10px; }
    }
  </style>
</head>
<body>
  <div id="view"></div>
  <header class="masthead">
    <div class="brand">
      <div class="eyebrow">Goddard Lab</div>
      <h1>Trajectory Monitor</h1>
    </div>
    <section class="telemetry" aria-live="polite">
      <div class="eyebrow">Live checkpoint</div>
      <div class="telemetry-row">
        <div id="checkpoint" class="checkpoint">waiting for stream</div>
        <div id="reward" class="reward">0.000</div>
      </div>
      <button id="copy-demo" class="copy-demo" type="button">Copy demo name</button>
      <div class="boost-grid">
        <div class="boost-meter">
          <header><span>Agent boost</span><output id="agent-boost">0</output></header>
          <i><b id="agent-boost-fill"></b></i>
        </div>
        <div class="boost-meter expert">
          <header><span>Expert boost</span><output id="expert-boost">0</output></header>
          <i><b id="expert-boost-fill"></b></i>
        </div>
      </div>
      <div class="action-readout" aria-label="Agent action">
        <span>H<b id="action-horizontal">0</b></span>
        <span>V<b id="action-vertical">0</b></span>
        <span>T<b id="action-throttle">0</b></span>
        <span>S<b id="action-slide">0</b></span>
        <span>B<b id="action-boost">0</b></span>
        <span>R<b id="action-roll">0</b></span>
        <span>J<b id="action-jump">0</b></span>
      </div>
      <div class="legend">
        <span><i class="swatch agent"></i>Agent</span>
        <span><i class="swatch expert"></i>Expert POV</span>
      </div>
    </section>
  </header>
  <div class="controls">
    <button id="previous">Previous demo</button>
    <button id="reset">Random demo</button>
    <button id="next">Next demo</button>
    <form id="demo-search" class="demo-search">
      <input id="demo-query" placeholder="Find demo" aria-label="Find demo">
      <button>Find</button>
    </form>
    <label class="speed-control">
      <span>Speed</span>
      <input id="speed" type="range" min="0.1" max="4" step="0.1" value="1">
      <output id="speed-value" for="speed">1x</output>
    </label>
    <div id="connection">Connecting</div>
  </div>
  <script type="importmap">
    {"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
  </script>
  <script type="module" src="/app.js"></script>
</body>
</html>
