[project]
name = "goddard"
version = "0.1.0"
description = "Wall-to-air Rocket League PPO curriculum"
requires-python = ">=3.11"
dependencies = [
    "carl[gymnasium]==0.1.0",
    "dotenv>=0.9.9",
    "jarl==0.1.0",
    "requests>=2.32",
    "rich>=14.1.0",
    "rlgym>=2.0.1",
    "subtr-actor-py>=1.2.0",
    "tenacity>=9.1.4",
    "tensorboard>=2.0",
    "torch>=2.7",
]

[tool.uv.sources]
carl = { path = "../CARL" }
jarl = { path = "../JARL" }
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
