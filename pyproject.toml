[project]
name = "goddard"
version = "0.1.0"
description = "Lean GPU-resident PPO and GAIFO for CARL"
requires-python = ">=3.11"
dependencies = [
    "carl==0.1.0",
    "dotenv>=0.9.9",
    "numba>=0.67.0",
    "numpy>=1.24",
    "pandas>=2.3.3",
    "pyarrow>=25.0.1",
    "requests>=2.32",
    "rich>=14.1.0",
    "rlgym>=2.0.1",
    "rlgym-tools>=2.6.5",
    "scipy>=1.17.1",
    "tenacity>=9.1.4",
    "tensorboard>=2.0",
    "torch>=2.7"
]

[tool.uv.sources]
carl = { git = "https://github.com/jwmccarthy/CARL.git", branch = "master" }
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
